version-template: '$MAJOR.$MINOR.$PATCH'
name-template: 'v$RESOLVED_VERSION-beta'
tag-template: 'v$RESOLVED_VERSION-beta'
prerelease: true
initial-version: '3.0.0'

categories:
    - title: ':boom: Breaking Changes'
      labels:
          - 'major'
          - 'breaking-change'
    - title: ':rocket: Features'
      labels:
          - 'feature'
          - 'enhancement'
    - title: ':bug: Bug Fixes'
      labels:
          - 'fix'
          - 'bugfix'
          - 'bug'
    - title: ':angel: Maintenance / Refactoring'
      labels:
          - 'chore'
          - 'refactoring'
    - title: ':mountain_bicyclist: CI / Tests'
      labels:
          - 'ci'
          - 'test'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
    major:
        labels:
            - 'major'
            - 'breaking-change'
    minor:
        labels:
            - 'feature'
            - 'enhancement'
    patch:
        labels:
            - 'fix'
            - 'bugfix'
            - 'bug'
            - 'chore'
            - 'refactoring'
            - 'ci'
            - 'test'
    default: patch

template: |
    ## What's Changed

    $CHANGES

    ---
    > :warning: This is a **pre-release** — do not use in production.

    Full Changelog: https://github.com/zeggriim2/riot-api-datadragon/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION-beta