version-template: '3.0.$PATCH'
name-template: 'v$RESOLVED_VERSION-beta'
tag-template: 'v$RESOLVED_VERSION-beta'
prerelease: true

categories:
    - title: ':boom: Breaking Changes'
      labels:
          - 'major'
          - 'breaking-change'
    - title: ':rocket: Features'
      labels:
          - 'feature'
          - 'enhancement'
    - title: ':bug: Bug Fixes'
      labels:
          - 'fix'
          - 'bugfix'
          - 'bug'
    - title: ':angel: Maintenance / Refactoring'
      labels:
          - 'chore'
          - 'refactoring'
    - title: ':mountain_bicyclist: CI / Tests'
      labels:
          - 'ci'
          - 'test'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
    patch:
        labels:
            - 'major'
            - 'breaking-change'
            - 'feature'
            - 'enhancement'
            - 'fix'
            - 'bugfix'
            - 'bug'
            - 'chore'
            - 'refactoring'
            - 'ci'
            - 'test'
    default: patch

template: |
    ## What's Changed

    $CHANGES

    ---
    > :warning: This is a **pre-release** of v3.0.0 — do not use in production.

    Full Changelog: https://github.com/zeggriim/riot-api-datadragon/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION-beta
