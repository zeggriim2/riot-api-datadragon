name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
    - title: ':rocket: Features'
      labels:
          - 'feature'
          - 'enhancement'
    - title: ':bug: Bug Fixes'
      labels:
          - 'fix'
          - 'bugfix'
          - 'bug'
    - title: ':angel: Maintenance / Refactoring'
      labels:
          - 'chore'
          - 'refactoring'
    - title: ':mountain_bicyclist: CI / Tests'
      labels:
          - 'ci'
          - 'test'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
    major:
        labels:
            - 'major'
            - 'breaking-change'
    minor:
        labels:
            - 'feature'
            - 'enhancement'
    patch:
        labels:
            - 'fix'
            - 'bugfix'
            - 'bug'
            - 'chore'
            - 'refactoring'
            - 'ci'
            - 'test'
    default: patch

template: |
    ## Changes

    $CHANGES

    ---
    Full Changelog: https://github.com/zeggriim/riot-api-datadragon/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
