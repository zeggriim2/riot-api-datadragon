services:
    Zeggriim\RiotApiDataDragon\RiotApiDataLeagueClient:
        autowire: true
        public: false
        arguments:
            $apiKey: '%env(string:API_RIOT_KEY)%'


    Zeggriim\RiotApiDataDragon\RiotApiDataDragonClient:
        autowire: true
        public: false

    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ChampionApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ItemApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\LanguageApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ProfileIconApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\SummonerApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\VersionApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\DataDragon\DataDragonApi:
        autowire: true
        public: false

    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ChampionApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ChampionApi'
    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ItemApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ItemApi'
    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\LanguageApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\LanguageApi'
    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ProfileIconApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\ProfileIconApi'
    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\SummonerApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\SummonerApi'
    Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\VersionApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataDragon\VersionApi'
    Zeggriim\RiotApiDataDragon\DataDragon\DataDragonApiInterface: '@Zeggriim\RiotApiDataDragon\DataDragon\DataDragonApi'


    Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\LeagueApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\SummonerApi:
        autowire: true

    Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\AccountApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\AccountApi'
    Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\LeagueApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\LeagueApi'
    Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\SummonerApiInterface: '@Zeggriim\RiotApiDataDragon\Endpoint\DataLeague\SummonerApi'

    # Normalizers
    Zeggriim\RiotApiDataDragon\Serializer\Normalizer\Champion\ChampionCollectionNormalizer:
        tags: [ 'serializer.normalizer' ]

    Zeggriim\RiotApiDataDragon\Serializer\Normalizer\LanguageCollectionNormalizer:
        tags: [ 'serializer.normalizer' ]

    Zeggriim\RiotApiDataDragon\Serializer\Normalizer\ProfileIcon\ProfileIconCollectionNormalizer:
        tags: [ 'serializer.normalizer' ]

    Zeggriim\RiotApiDataDragon\Serializer\Normalizer\ProfileIcon\ProfileIconNormalizer:
        tags: [ 'serializer.normalizer' ]

    Zeggriim\RiotApiDataDragon\Serializer\Normalizer\Item\ItemCollectionNormalizer:
        tags: [ 'serializer.normalizer' ]

    # Transformers
    Zeggriim\RiotApiDataDragon\Transformer\ChampionTransformer:
        arguments:
            $denormalizer: '@serializer'

    Zeggriim\RiotApiDataDragon\Transformer\LanguageTransformer:
        arguments:
            $denormalizer: '@serializer'

    Zeggriim\RiotApiDataDragon\Transformer\ProfileIconTransformer:
        arguments:
            $denormalizer: '@serializer'

    Zeggriim\RiotApiDataDragon\Transformer\ItemTransformer:
        arguments:
            $denormalizer: '@serializer'

    Zeggriim\RiotApiDataDragon\Transformer\SummonerTransformer:
        arguments:
            $denormalizer: '@serializer'
